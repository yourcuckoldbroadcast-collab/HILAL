<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>HILAL — Almanak Ibadah</title>
<meta name="description" content="Almanak Islam yang menyorot momentum ibadah terdekat berdasarkan kalender Hijriah. Offline-first, tanpa server." />
<meta name="theme-color" content="#06140f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HILAL" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" href="./favicon-64.png" />
<style>
:root{
  --bg:#071f18; --bg2:#05120d;
  --surface:#0c3025; --surface-2:#0f3a2d; --surface-3:#124235;
  --line:rgba(203,166,78,.16); --line-soft:rgba(242,233,216,.07);
  --emerald:#1b5e47; --teal:#0f5c57;
  --gold:#cba64e; --gold-hi:#e6cd92; --gold-soft:rgba(203,166,78,.13);
  --cream:#f3ebd9; --cream-2:#cbd5c7; --muted:#86a092; --muted-2:#5d7568;
  --danger:#c98a6a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--cream); background:var(--bg2);
  min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 70% at 50% -10%, rgba(27,94,71,.55), transparent 60%),
    radial-gradient(90% 60% at 85% 5%, rgba(15,92,87,.32), transparent 55%),
    radial-gradient(60% 40% at 12% 30%, rgba(203,166,78,.06), transparent 60%);
  background-attachment:fixed;
}
body::before{ /* faint star field */
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.5; z-index:0;
  background-image:
    radial-gradient(1px 1px at 20% 18%, rgba(242,233,216,.6), transparent),
    radial-gradient(1px 1px at 70% 12%, rgba(242,233,216,.45), transparent),
    radial-gradient(1px 1px at 42% 28%, rgba(203,166,78,.5), transparent),
    radial-gradient(1px 1px at 88% 22%, rgba(242,233,216,.4), transparent),
    radial-gradient(1px 1px at 12% 42%, rgba(242,233,216,.3), transparent);
}
.wrap{ position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column; padding:0 16px;
  padding-top:max(14px,env(safe-area-inset-top));
  padding-bottom:calc(86px + env(safe-area-inset-bottom)); }

/* ---------- top bar ---------- */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand .mark{ width:30px; height:30px; flex:none; }
.brand h1{ font-family:var(--serif); font-weight:600; font-size:20px; letter-spacing:.32em; margin:0;
  color:var(--cream); padding-left:.32em; }
.topbar .today-mini{ text-align:right; font-family:var(--serif); }
.today-mini .h{ font-size:14px; color:var(--gold-hi); letter-spacing:.02em; }
.today-mini .g{ font-size:11px; color:var(--muted); letter-spacing:.04em; }

/* ---------- view system ---------- */
.view{ display:none; animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
.view.active{ display:block; }
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.stagger>*{ animation:rise .55s cubic-bezier(.2,.7,.2,1) both; }
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.14s}
.stagger>*:nth-child(4){animation-delay:.2s}
.stagger>*:nth-child(5){animation-delay:.26s}
.stagger>*:nth-child(6){animation-delay:.32s}

/* ---------- today strip ---------- */
.daystrip{ text-align:center; padding:6px 0 18px; }
.daystrip .weekday{ font-family:var(--sans); font-size:12px; letter-spacing:.34em; text-transform:uppercase;
  color:var(--muted); margin-bottom:6px; }
.daystrip .hijri{ font-family:var(--serif); font-size:34px; line-height:1.05; color:var(--cream); }
.daystrip .hijri b{ color:var(--gold-hi); font-weight:600; }
.daystrip .greg{ font-family:var(--serif); font-size:14px; color:var(--cream-2); margin-top:6px; font-style:italic; }

/* ---------- cards ---------- */
.card{ background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--line); border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow); margin-bottom:14px; }
.section-title{ font-family:var(--sans); font-size:11px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--muted); margin:22px 4px 12px; display:flex; align-items:center; gap:10px; }
.section-title::after{ content:""; flex:1; height:1px; background:var(--line-soft); }

/* ---------- hero ---------- */
.hero{ position:relative; overflow:hidden;
  background:
    radial-gradient(120% 120% at 88% -20%, rgba(203,166,78,.18), transparent 55%),
    linear-gradient(155deg,#10463a,#0a2c23);
  border:1px solid var(--line); border-radius:24px; padding:24px 22px 22px;
  box-shadow:var(--shadow); }
.hero .moon{ position:absolute; right:-26px; top:-30px; width:150px; height:150px; opacity:.9; }
.hero .kicker{ font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold);
  display:flex; align-items:center; gap:8px; }
.hero .kicker .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold);
  box-shadow:0 0 0 0 rgba(203,166,78,.6); animation:pulse 2.4s infinite; }
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(203,166,78,.5)}70%{box-shadow:0 0 0 9px rgba(203,166,78,0)}100%{box-shadow:0 0 0 0 rgba(203,166,78,0)}}
.hero h2{ font-family:var(--serif); font-size:30px; line-height:1.08; margin:14px 0 4px; max-width:78%; }
.hero .hdate{ font-family:var(--serif); font-style:italic; color:var(--cream-2); font-size:14px; }
.hero .count{ margin-top:18px; display:flex; align-items:baseline; gap:10px; }
.hero .count .num{ font-family:var(--serif); font-size:46px; color:var(--gold-hi); line-height:1; font-weight:600; }
.hero .count .lbl{ font-size:13px; color:var(--cream-2); letter-spacing:.04em; }
.hero .insight{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft);
  font-size:13.5px; line-height:1.55; color:var(--cream-2); }
.tag{ display:inline-block; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--gold);
  background:var(--gold-soft); }
.tag.est{ color:var(--danger); border-color:rgba(201,138,106,.3); background:rgba(201,138,106,.1); }

/* ---------- chips ---------- */
.chips{ display:flex; gap:9px; flex-wrap:wrap; }
.chip{ font-size:12px; padding:9px 13px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--cream); display:flex; align-items:center; gap:7px; cursor:pointer; }
.chip .ic{ color:var(--gold); font-size:13px; }
.chip:active{ transform:scale(.97); }

/* ---------- feed ---------- */
.toggle{ display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:4px; gap:4px; }
.toggle button{ flex:1; border:none; background:none; color:var(--muted); font-family:var(--sans);
  font-size:12.5px; letter-spacing:.04em; padding:9px 8px; border-radius:999px; cursor:pointer; }
.toggle button.on{ background:linear-gradient(160deg,var(--emerald),#134537); color:var(--cream);
  box-shadow:0 4px 14px -6px rgba(0,0,0,.6); }
.search{ display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line);
  border-radius:13px; padding:0 13px; margin-bottom:12px; }
.search svg{ width:17px; height:17px; flex:none; stroke:var(--muted); fill:none; stroke-width:1.8; stroke-linecap:round; }
.search input{ flex:1; min-width:0; border:none; background:none; color:var(--cream); font-family:var(--sans); font-size:14px; padding:12px 0; outline:none; }
.search input::placeholder{ color:var(--muted-2); }
.evt{ display:flex; gap:14px; padding:15px 4px; border-bottom:1px solid var(--line-soft); cursor:pointer; }
.evt:last-child{ border-bottom:none; }
.evt .when{ flex:none; width:58px; text-align:center; }
.evt .when .n{ font-family:var(--serif); font-size:24px; color:var(--gold-hi); line-height:1; }
.evt .when .u{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
.evt .when.now .n{ font-size:13px; line-height:1.2; padding-top:5px; color:var(--gold); }
.evt .body{ flex:1; min-width:0; }
.evt .body .t{ font-family:var(--serif); font-size:17px; color:var(--cream); }
.evt .body .m{ font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.evt .body .ins{ font-size:13px; line-height:1.5; color:var(--cream-2); margin-top:9px; display:none;
  padding:11px 13px; background:rgba(0,0,0,.18); border-radius:12px; border:1px solid var(--line-soft); }
.evt.open .ins{ display:block; }
.cat-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.cat-weekly{ background:#6fae8f } .cat-monthly{ background:var(--teal) }
.cat-annual{ background:var(--gold) } .cat-user{ background:#b98ad0 } .cat-season{ background:#d0a76a }
.group-label{ font-family:var(--serif); font-size:13px; font-style:italic; color:var(--gold);
  margin:18px 4px 2px; }

/* ---------- banner ---------- */
.banner{ background:linear-gradient(160deg,#3a3014,#241d0c); border:1px solid rgba(203,166,78,.35);
  border-radius:16px; padding:16px; margin-bottom:14px; }
.banner .h{ font-family:var(--serif); font-size:16px; color:var(--gold-hi); margin-bottom:4px; }
.banner .p{ font-size:13px; color:var(--cream-2); line-height:1.5; }
.banner .row{ display:flex; gap:9px; margin-top:13px; }
.btn{ font-family:var(--sans); font-size:13px; padding:10px 15px; border-radius:11px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--cream); }
.btn.primary{ background:linear-gradient(160deg,var(--gold),#a9863a); color:#241d0c; border-color:transparent; font-weight:600; }
.btn.ghost{ background:none; }
.btn:active{ transform:scale(.97); }
.btn.block{ width:100%; }

/* ---------- calendar ---------- */
.cal-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.cal-head .cal-nav{ flex:0 0 44px; width:44px; height:44px; padding:0; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--gold); font-size:24px; line-height:42px; text-align:center;
  cursor:pointer; -webkit-user-select:none; user-select:none; }
.cal-head .cal-nav:active{ background:var(--surface-3); }
.cal-head .title{ flex:1 1 auto; min-width:0; text-align:center; font-family:var(--serif); }
.cal-head .title .m{ font-size:20px; color:var(--cream); }
.cal-head .title .y{ font-size:12px; color:var(--muted); letter-spacing:.1em; margin-top:2px; }
.today-jump{ width:100%; margin:6px 0 14px; font-size:12.5px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-grid .dow{ text-align:center; font-size:10px; letter-spacing:.06em; color:var(--muted);
  padding:4px 0 8px; text-transform:uppercase; }
.cell{ aspect-ratio:1; border-radius:11px; border:1px solid transparent; display:flex; flex-direction:column;
  align-items:center; justify-content:center; cursor:pointer; position:relative; background:rgba(255,255,255,.015); overflow:hidden; }
.cell .hd{ font-family:var(--serif); font-size:16px; color:var(--cream); line-height:1; }
.cell .gd{ font-size:8.5px; color:var(--muted-2); margin-top:2px; }
.cell.muted{ opacity:.3; }
.cell.muted .hd{ color:var(--muted); }
.cell.sel{ background:linear-gradient(160deg,var(--emerald),#0e3a2d); border-color:var(--line); }
.cell.sacred{ background:linear-gradient(160deg,rgba(150,118,214,.16),rgba(108,84,160,.08)); border-color:rgba(168,138,224,.30); }
.cell.sacred .hd{ color:#d9c8f5; }
.cell.sacred .gd{ color:#9f8fc8; }
.cell.sacred-odd{ background:radial-gradient(125% 120% at 50% 18%,rgba(176,144,232,.40),rgba(96,70,150,.20)); border-color:rgba(196,166,244,.55);
  box-shadow:0 0 18px -5px rgba(150,112,222,.55), inset 0 0 0 1px rgba(206,178,248,.16); }
.cell.sacred-odd .hd{ color:#f1e8ff; font-weight:600; }
.cell.sacred-odd .gd{ color:#c3b2e8; }
.cell.sacred-odd::after{ content:"\2726"; position:absolute; top:3px; right:5px; font-size:8px; line-height:1; color:var(--gold-hi); opacity:.9; }
.chip.sacred{ border-color:rgba(190,162,240,.42); background:rgba(150,118,214,.14); color:#e7dcfa; }
.chip.sacred .ic{ color:#c4a8f0; }
.sacred-note{ font-size:12.5px; line-height:1.55; color:#cdbdf0; background:linear-gradient(160deg,rgba(150,118,214,.16),rgba(108,84,160,.08));
  border:1px solid rgba(168,138,224,.3); border-radius:12px; padding:11px 13px; margin-bottom:12px; }
.sacred-note.odd{ color:#efe6ff; border-color:rgba(196,166,244,.5); background:radial-gradient(140% 130% at 0% 0%,rgba(176,144,232,.26),rgba(96,70,150,.12)); }
.sacred-note b{ color:var(--gold-hi); }
.cell.forbidden::before{ content:""; position:absolute; top:5px; left:5px; width:5px; height:5px; border-radius:50%; background:var(--danger); }
.cell.today.forbidden::before{ background:#7a2e12; }
.forbidden-note{ font-size:12.5px; line-height:1.55; color:#e8b69e; background:rgba(201,138,106,.12);
  border:1px solid rgba(201,138,106,.34); border-radius:12px; padding:11px 13px; margin-bottom:12px; }
.cell.today{ background:linear-gradient(160deg,var(--gold-hi),var(--gold)); border-color:var(--gold-hi);
  box-shadow:0 2px 8px -4px rgba(203,166,78,.5); }
.cell.today .hd{ color:#241d0c; font-weight:600; }
.cell.today .gd{ color:#5c4a1c; }
.cell.today::after{ content:none; }
.cell.today.sacred-odd{ box-shadow:0 2px 8px -4px rgba(203,166,78,.5), 0 0 0 2px rgba(190,158,238,.6); }
.cell .ev-dot{ position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:var(--gold); }
.cell.today .ev-dot{ background:#241d0c; }
.cell.muted .ev-dot{ opacity:.5; }
.cal-detail{ margin-top:16px; }

/* ---------- forms ---------- */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); margin-bottom:7px; }
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%; font-family:var(--sans); font-size:15px; color:var(--cream);
  background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:12px; padding:12px 13px; }
input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--gold); }
textarea{ resize:vertical; min-height:64px; }
.seg{ display:flex; gap:7px; }
.seg button{ flex:1; padding:11px 6px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); color:var(--muted); font-family:var(--sans); font-size:12.5px; cursor:pointer; }
.seg button.on{ background:linear-gradient(160deg,var(--emerald),#134537); color:var(--cream); border-color:transparent; }

/* ---------- settings ---------- */
.set-row{ display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:15px 2px; border-bottom:1px solid var(--line-soft); }
.set-row:last-child{ border-bottom:none; }
.set-row .l .t{ font-size:15px; color:var(--cream); }
.set-row .l .d{ font-size:12px; color:var(--muted); margin-top:3px; line-height:1.45; }
.stepper{ display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:11px; overflow:hidden; flex:none; }
.stepper button{ width:40px; height:40px; border:none; background:var(--surface); color:var(--gold); font-size:20px; cursor:pointer; }
.stepper .v{ width:46px; text-align:center; font-family:var(--serif); font-size:17px; color:var(--cream-2); }
.lockcard{ border:1px solid var(--line-soft); border-radius:13px; padding:13px; margin-bottom:10px; background:rgba(0,0,0,.14); }
.lockcard .top{ display:flex; justify-content:space-between; align-items:center; }
.lockcard .nm{ font-family:var(--serif); font-size:16px; color:var(--cream); }
.lockcard .st{ font-size:11.5px; margin-top:2px; }
.lockcard .st.locked{ color:var(--gold-hi); } .lockcard .st.est{ color:var(--danger); }
.lockcard .actions{ display:flex; gap:8px; margin-top:11px; }
.muted-note{ font-size:12px; color:var(--muted); line-height:1.55; }
/* backup & restore */
.bk-summary{ border:1px solid var(--line-soft); border-radius:13px; padding:4px 14px; margin:8px 0 16px; background:rgba(0,0,0,.16); }
.bk-row{ display:flex; justify-content:space-between; gap:14px; padding:9px 0; font-size:13px; border-bottom:1px solid var(--line-soft); }
.bk-row:last-child{ border-bottom:none; }
.bk-row .k{ color:var(--muted); } .bk-row .v{ color:var(--cream); text-align:right; font-family:var(--serif); }
.bk-row .v.gold{ color:var(--gold-hi); }
.bk-actions>button+button{ margin-top:9px; }
textarea.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; line-height:1.5; }

/* ---------- empty ---------- */
.empty{ text-align:center; padding:42px 20px; color:var(--muted); }
.empty .mn{ width:54px; height:54px; opacity:.5; margin:0 auto 14px; }
.empty .t{ font-family:var(--serif); font-size:17px; color:var(--cream-2); }
.empty .d{ font-size:13px; margin-top:6px; line-height:1.5; }
.fab{ position:fixed; right:max(18px,calc((100vw - 480px)/2 + 18px)); bottom:calc(96px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:18px; border:none; z-index:20;
  background:linear-gradient(160deg,var(--gold),#a9863a); color:#241d0c; font-size:32px; cursor:pointer;
  box-shadow:0 14px 30px -10px rgba(0,0,0,.7); text-align:center; line-height:56px; padding:0; }
.fab:active{ transform:scale(.94); }

/* ---------- bottom nav ---------- */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(0deg,var(--bg2),rgba(5,18,13,.86)); backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft); }
.nav .inner{ max-width:480px; margin:0 auto; display:flex; }
.nav button{ flex:1; border:none; background:none; color:var(--muted-2); padding:11px 4px 12px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; font-family:var(--sans); font-size:10px; letter-spacing:.06em; }
.nav button svg{ width:22px; height:22px; margin:0 auto; stroke:currentColor; fill:none; stroke-width:1.6; }
.nav button.on{ color:var(--gold-hi); }
.nav button.on svg{ stroke:var(--gold-hi); }

/* ---------- modal ---------- */
.modal{ position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; justify-content:center; }
.modal.show{ display:flex; }
.modal .scrim{ position:absolute; inset:0; background:rgba(2,8,6,.72); backdrop-filter:blur(3px); animation:fade .2s both; }
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{ position:relative; width:100%; max-width:480px; background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line); border-bottom:none; border-radius:24px 24px 0 0; padding:22px 18px calc(26px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow); animation:slideup .34s cubic-bezier(.2,.8,.2,1) both; max-height:88dvh; overflow:auto; }
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{ width:42px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 18px; }
.sheet h3{ font-family:var(--serif); font-size:21px; margin:0 0 16px; color:var(--cream); }
.toast{ position:fixed; bottom:calc(104px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--surface-3); border:1px solid var(--line); color:var(--cream); font-size:13px;
  padding:11px 17px; border-radius:99px; z-index:60; box-shadow:var(--shadow); opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
.link{ color:var(--gold); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
/* ---------- profiling ---------- */
.invite{ text-align:center; padding:18px 16px 6px; }
.invite .em{ width:84px; height:84px; margin:6px auto 16px; }
.invite h2{ font-family:var(--serif); font-size:24px; margin:0 0 10px; color:var(--cream); }
.invite p{ font-size:13.5px; line-height:1.6; color:var(--cream-2); margin:0 auto 8px; max-width:330px; }
.invite .muted-note{ max-width:330px; margin:6px auto 18px; }

<script>
"use strict";
/* ============================================================
   HILAL — Almanak Ibadah
   Engine Hijriah (Umm al-Qura via Intl) + koreksi hari + lock
   penetapan oleh user. Offline-first, data di localStorage.
   ============================================================ */

const MH = ['Muharram','Safar','Rabiul Awal','Rabiul Akhir','Jumadil Awal','Jumadil Akhir','Rajab',"Sya'ban",'Ramadhan','Syawal',"Dzulqa'dah",'Dzulhijjah'];
const MG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DG = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const DGS = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const MS = 86400000;

/* ---------- state ---------- */
const DEFAULT = { settings:{ dayOffset:0, feedMode:'countdays' }, locks:{}, custom:[], dismissed:{},
  profile:{ started:false, startedAt:null, track:{}, score:0,
    title:{key:'truth',hy:null,hm:null}, artifacts:['truth'],
    q:{ day:null, batch:[], batchN:1, doneToday:0, exhausted:false, maxedStreak:0, penaltyUntil:null, lastDone:null } } };
let S = load();
function load(){ let s; try{ s=Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(localStorage.getItem('hilal')||'{}')); }catch(e){ s=JSON.parse(JSON.stringify(DEFAULT)); }
  s.profile=Object.assign(JSON.parse(JSON.stringify(DEFAULT.profile)), s.profile||{});
  s.profile.q=Object.assign(JSON.parse(JSON.stringify(DEFAULT.profile.q)), s.profile.q||{});
  s.profile.track=s.profile.track||{}; if(!Array.isArray(s.profile.artifacts)) s.profile.artifacts=['truth'];
  return s; }
function save(){ try{ localStorage.setItem('hilal', JSON.stringify(S)); }catch(e){} }

/* ---------- hijri engine ---------- */
const FMT = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'});
function noon(d){ const x=new Date(d); x.setHours(12,0,0,0); return x; }
function addDays(d,n){ return new Date(noon(d).getTime()+n*MS); }
function sameDay(a,b){ a=noon(a); b=noon(b); return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function daysFromToday(d){ return Math.round((noon(d)-noon(new Date()))/MS); }
function toISO(d){ d=noon(d); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromISO(s){ const [y,m,dd]=s.split('-').map(Number); return noon(new Date(y,m-1,dd)); }

function g2hRaw(date){ const p=FMT.formatToParts(noon(date)); let o={}; for(const x of p){ if(x.type==='year')o.hy=+x.value; if(x.type==='month')o.hm=+x.value; if(x.type==='day')o.hd=+x.value; } return o; }
function g2h(date){ return g2hRaw(addDays(date, S.settings.dayOffset||0)); }
function h2gRaw(hy,hm,hd){
  const epoch=new Date(Date.UTC(622,6,19));
  const est=(hy-1)*354.367+(hm-1)*29.53+(hd-1);
  let d=noon(new Date(epoch.getTime()+est*MS));
  for(let i=0;i<8;i++){ const c=g2hRaw(d); const diff=(hy-c.hy)*354+(hm-c.hm)*29.53+(hd-c.hd); if(Math.abs(diff)<.5)break; d=addDays(d,Math.round(diff)); }
  for(let s=-3;s<=3;s++){ const t=addDays(d,s); const c=g2hRaw(t); if(c.hy===hy&&c.hm===hm&&c.hd===hd) return t; }
  return d;
}
function h2g(hy,hm,hd){
  const key=hy+'-'+hm;
  if(S.locks[key]) return addDays(fromISO(S.locks[key]), hd-1);     // lock = tanggal pasti dari user
  return addDays(h2gRaw(hy,hm,hd), -(S.settings.dayOffset||0));
}
function fmtH(h){ return h.hd+' '+MH[h.hm-1]+' '+h.hy; }
function fmtG(d){ d=noon(d); return DG[d.getDay()]+', '+d.getDate()+' '+MG[d.getMonth()]+' '+d.getFullYear(); }
function fmtGshort(d){ d=noon(d); return d.getDate()+' '+MG[d.getMonth()].slice(0,3)+' '+d.getFullYear(); }

/* ---------- event definitions ---------- */
// lock=true => awal bulan ini termasuk penetapan resmi (isbat)
const ANNUAL = [
  {hm:1, hd:1,  key:'tahunbaru', t:'Tahun Baru Islam', ins:'Awal tahun Hijriah, memperingati hijrah Nabi ﷺ dari Makkah ke Madinah.'},
  {hm:1, hd:9,  key:'tasua',     t:'Puasa Tasua',      ins:'Puasa sunnah pada 9 Muharram, mengiringi puasa Asyura.'},
  {hm:1, hd:10, key:'asyura',    t:'Puasa Asyura',     ins:'Puasa sunnah yang sangat dianjurkan pada 10 Muharram.'},
  {hm:3, hd:12, key:'maulid',    t:'Maulid Nabi ﷺ',    ins:'Peringatan kelahiran Nabi Muhammad ﷺ.'},
  {hm:7, hd:27, key:'isramiraj', t:"Isra Mi'raj",      ins:'Peringatan perjalanan malam Nabi ﷺ dan diterimanya perintah shalat.'},
  {hm:8, hd:15, key:'nisfu',     t:"Nisfu Sya'ban",    ins:'Malam pertengahan Sya\u2019ban, sebagian memperbanyak ibadah sebagai persiapan Ramadhan.'},
  {hm:9, hd:1,  key:'ramadhan',  t:'Awal Ramadhan',    lock:true, ins:'Awal bulan puasa wajib. Tanggal pastinya ditetapkan melalui rukyat / penetapan resmi.'},
  {hm:9, hd:17, key:'nuzulul',   t:"Nuzulul Qur'an",   ins:'Diperingati sebagai waktu pertama turunnya Al-Qur\u2019an.'},
  {hm:10,hd:1,  key:'idulfitri', t:'Idul Fitri',       lock:true, ins:'Hari raya setelah Ramadhan. Tanggalnya ditetapkan melalui penetapan resmi. Diharamkan berpuasa pada hari ini.'},
  {hm:12,hd:1,  key:'dzulhijjah',t:'Awal Dzulhijjah',  lock:true, ins:'Memulai sepuluh hari pertama Dzulhijjah yang utama untuk amal saleh.'},
  {hm:12,hd:9,  key:'arafah',    t:'Puasa Arafah',     ins:'Puasa sunnah utama bagi yang tidak sedang berhaji.'},
  {hm:12,hd:10, key:'iduladha',  t:'Idul Adha',        ins:'Hari raya kurban. Diharamkan berpuasa pada hari ini dan pada hari Tasyrik (11\u201313 Dzulhijjah).'},
];
const LOCK_MONTHS = [ {hm:9,nm:'Awal Ramadhan'}, {hm:10,nm:'Idul Fitri (1 Syawal)'}, {hm:12,nm:'Awal Dzulhijjah'} ];
const WEEKLY = [
  {wd:1, t:'Puasa Senin', ins:'Hari Senin dianjurkan berpuasa sunnah.'},
  {wd:4, t:'Puasa Kamis', ins:'Hari Kamis dianjurkan berpuasa sunnah; malam harinya adalah malam Jumat.'},
  {wd:5, t:'Baca Surah Al-Kahfi', ins:'Hari Jumat adalah hari paling utama dalam sepekan \u2014 dianjurkan membaca surah Al-Kahfi dan memperbanyak shalawat.'},
];

function isLockedMonth(hy,hm){ return !!S.locks[hy+'-'+hm]; }

/* ---------- generate events ---------- */
function genEvents(){
  const today = noon(new Date());
  const back = addDays(today,-1);
  const horizon = addDays(today,380);
  const out=[];
  const push=(o)=>{ if(o.date>=back && o.date<=horizon) out.push(o); };
  const th = g2h(today);

  // annual
  for(let hy=th.hy; hy<=th.hy+1; hy++){
    for(const d of ANNUAL){
      const date=h2g(hy,d.hm,d.hd);
      const est = d.lock && !isLockedMonth(hy,d.hm);
      // arafah/adha depend on dzulhijjah lock
      const depEst = (d.hm===12 && (d.hd===9||d.hd===10) && !isLockedMonth(hy,12));
      push({ id:'a-'+d.key+'-'+hy, source:'system', cat:'annual', t:d.t, ins:d.ins,
             date, hijri:{hy,hm:d.hm,hd:d.hd}, est: est||depEst });
    }
  }
  // monthly (awal bulan + ayyamul bidh) for 13 hijri months
  let cy=th.hy, cm=th.hm;
  for(let i=0;i<13;i++){
    const d1=h2g(cy,cm,1);
    push({ id:'m1-'+cy+'-'+cm, source:'system', cat:'monthly', t:'Awal '+MH[cm-1],
           ins:'Pergantian bulan Hijriah \u2014 momen memperbarui niat dan amalan.',
           date:d1, hijri:{hy:cy,hm:cm,hd:1} });
    const abDays=[13,14,15].filter(dd=> !fastingForbidden({hm:cm,hd:dd}));
    if(abDays.length){
      const abAnchor=h2g(cy,cm,abDays[0]);
      const abSpan=(abDays.length===3?'13\u201315':abDays.join(', '))+' '+MH[cm-1];
      const abIns=(cm===12)
        ? 'Puasa "hari-hari putih". Di Dzulhijjah hanya 14\u201315, karena 13 termasuk hari Tasyrik yang diharamkan berpuasa.'
        : 'Puasa tiga hari di pertengahan bulan (13, 14, 15) \u2014 "hari-hari putih".';
      push({ id:'ab-'+cy+'-'+cm, source:'system', cat:'monthly', t:'Puasa Ayyamul Bidh',
             ins:abIns, date:abAnchor, hijri:{hy:cy,hm:cm,hd:abDays[0]}, span:abSpan });
    }
    // Shalat Tasbih: malam Jumat pertama (Kamis pertama) tiap bulan Hijriah
    const tAdd=(4 - noon(d1).getDay() + 7) % 7;   // 4 = Kamis (malam Jumat)
    push({ id:'tasbih-'+cy+'-'+cm, source:'system', cat:'monthly', t:'Shalat Tasbih',
           ins:'Shalat sunnah tasbih pada malam Jumat pertama bulan '+MH[cm-1]+' \u2014 utama dikerjakan di malam hari. Memberi poin untuk Shalat Sunnah sekaligus Qiyamul Lail.',
           date:addDays(d1,tAdd), hijri:{hy:cy,hm:cm,hd:1+tAdd} });
    cm++; if(cm>12){cm=1;cy++;}
  }
  // weekly: kejadian terdekat; puasa Senin/Kamis melompati hari yang diharamkan berpuasa
  for(const w of WEEKLY){
    let add=(w.wd - today.getDay()+7)%7;
    let date=addDays(today,add);
    if(w.wd===1 || w.wd===4){ let guard=0; while(fastingForbidden(g2h(date)) && guard<6){ date=addDays(date,7); guard++; } }
    push({ id:'w-'+w.wd, source:'system', cat:'weekly', t:w.t, ins:w.ins, date, weekly:true });
  }
  // custom
  for(const c of S.custom){
    const occ = nextCustomOccurrence(c, today, horizon);
    if(occ) push({ id:'u-'+c.id, source:'user', cat:'user', t:c.title, ins:c.note||'', date:occ,
                   recurDesc: recurDesc(c), customId:c.id });
  }
  out.sort((a,b)=> a.date-b.date || prio(b)-prio(a));
  return out;
}
function nextCustomOccurrence(c, today, horizon){
  if(c.type==='once'){ const d=fromISO(c.date); return (d>=addDays(today,-1)&&d<=horizon)?d:null; }
  if(c.type==='weekly'){ let add=(c.weekday - today.getDay()+7)%7; return addDays(today,add); }
  if(c.type==='monthly'){
    const t=noon(today); let y=t.getFullYear(), m=t.getMonth();
    for(let i=0;i<2;i++){
      const last=new Date(y,m+1,0).getDate(); const day=Math.min(c.monthday,last);
      const d=noon(new Date(y,m,day));
      if(d>=t) return d;
      m++; if(m>11){m=0;y++;}
    }
  }
  return null;
}
function recurDesc(c){
  if(c.type==='weekly') return 'Setiap '+DG[c.weekday];
  if(c.type==='monthly') return 'Setiap tanggal '+c.monthday;
  return 'Sekali';
}
function prio(e){ return e.cat==='season'?5:e.cat==='annual'?4:e.cat==='monthly'?2:e.cat==='user'?3:1; }

/* ---------- seasonal contexts ---------- */
function sacredClass(h){ if(!h) return '';
  if(h.hm===9 && h.hd>=21) return (h.hd%2===1)?'sacred-odd':'sacred';   // 10 malam terakhir Ramadhan
  if(h.hm===12 && h.hd>=1 && h.hd<=10) return 'sacred';                 // 10 hari pertama Dzulhijjah (violet lembut)
  if(h.hm===8 && h.hd===15) return 'sacred-odd';                        // Nisfu Sya'ban (highlight)
  if(h.hm===8 && (h.hd===13||h.hd===14)) return 'sacred';              // Ayyamul Bidh Sya'ban (violet lembut)
  return ''; }
function isHaram(hm){ return hm===1||hm===7||hm===11||hm===12; }   // Muharram, Rajab, Dzulqa'dah, Dzulhijjah
function fastingForbidden(h){ if(!h) return null; if(h.hm===10 && h.hd===1) return 'Idul Fitri'; if(h.hm===12 && h.hd===10) return 'Idul Adha'; if(h.hm===12 && h.hd>=11 && h.hd<=13) return 'Hari Tasyrik'; return null; }
function cellClasses(h){ const a=[]; const s=sacredClass(h); if(s)a.push(s); if(fastingForbidden(h))a.push('forbidden'); return a.join(' '); }
function seasons(){
  const th=g2h(new Date()); const out=[];
  if([1,7,11,12].includes(th.hm)) out.push({t:'Bulan Haram',ins:'Termasuk empat bulan yang dimuliakan: Dzulqa\u2019dah, Dzulhijjah, Muharram, dan Rajab.'});
  if(th.hm===12 && th.hd<=10) out.push({t:'10 Hari Pertama Dzulhijjah',ins:'Hari-hari yang utama untuk memperbanyak amal saleh.'});
  if(th.hm===9 && th.hd>=21) out.push({t:'Sepuluh Malam Terakhir Ramadhan',sacred:true,ins:'Malam-malam paling utama dalam setahun. Dianjurkan i\u2019tikaf dan memperbanyak ibadah; pada malam-malam ganjil diharap turunnya Lailatul Qadar.'});
  if(th.hm===9) out.push({t:'Bulan Ramadhan',ins:'Bulan puasa, sabar, dan memperbanyak Al-Qur\u2019an.'});
  if(th.hm===8) out.push({t:"Sya'ban \u2014 Persiapan Ramadhan",ins:'Bulan persiapan menuju Ramadhan; sebagian memperbanyak puasa sunnah.'});
  return out;
}

/* ---------- isbat confirmation ---------- */
function pendingConfirm(){
  const today=noon(new Date()); const th=g2h(today);
  for(let hy=th.hy; hy<=th.hy+1; hy++){
    for(const lm of LOCK_MONTHS){
      const key=hy+'-'+lm.hm;
      if(S.locks[key]||S.dismissed['c'+key]) continue;
      const est=addDays(h2gRaw(hy,lm.hm,1), -(S.settings.dayOffset||0));
      const dd=daysFromToday(est);
      if(dd>=0 && dd<=8) return {key,hy,hm:lm.hm,nm:lm.nm,est,dd};
    }
  }
  return null;
}

function recurDesc2(e){ return e.recurDesc||''; }

function pickHero(events){
  const today=noon(new Date());
  const todays=events.filter(e=>sameDay(e.date,today)).sort((a,b)=>prio(b)-prio(a));
  if(todays.length) return todays[0];
  const ann=events.filter(e=>e.cat==='annual'&&daysFromToday(e.date)>=0&&daysFromToday(e.date)<=60);
  if(ann.length) return ann[0];
  return events.find(e=>daysFromToday(e.date)>=0)||events[0];
}

function evtRow(e){
  const wl=whenLabel(e.date);
  const meta=[];
  if(e.span) meta.push(esc(e.span));
  else if(e.hijri) meta.push(esc(fmtH(e.hijri)));
  if(e.recurDesc) meta.push(esc(e.recurDesc));
  meta.push(esc(fmtGshort(e.date)));
  return `<div class="evt" data-evt="${e.id}">
    <div class="when ${wl.now?'now':''}"><div class="n">${wl.n}</div><div class="u">${wl.u}</div></div>
    <div class="body">
      <div class="t">${esc(e.t)} ${e.est?'<span class="tag est">perkiraan</span>':''}</div>
      <div class="m"><span class="cat-dot cat-${e.cat}"></span>${meta.join(' \u00b7 ')}</div>
      ${e.ins?`<div class="ins">${esc(e.ins)}${e.source==='user'?' <span class="link" data-edit="'+e.customId+'">Ubah catatan</span>':''}</div>`:''}
    </div>
  </div>`;
}
function feedCountdays(events){
  const list=events.filter(e=>daysFromToday(e.date)>=0).slice(0,40);
  if(!list.length) return emptyInline('Belum ada momentum dalam jangkauan.');
  return list.map(evtRow).join('');
}
function feedCategory(events){
  const up=events.filter(e=>daysFromToday(e.date)>=0);
  const groups=[['weekly','Pekan ini'],['monthly','Bulan Hijriah ini'],['annual','Tahunan mendatang'],['user','Catatan pribadi']];
  let h='';
  for(const [c,label] of groups){
    const g=up.filter(e=>e.cat===c).slice(0, c==='annual'?8:6);
    if(!g.length) continue;
    h+=`<div class="group-label">${label}</div>`+g.map(evtRow).join('');
  }
  return h||emptyInline('Belum ada momentum dalam jangkauan.');
}
function emptyInline(t){ return `<div style="text-align:center;color:var(--muted);padding:24px 8px;font-size:13px">${esc(t)}</div>`; }

function isCalToday(){ const t=noon(new Date()); if(calMode==='hijri'){ const th=g2h(new Date()); return calH.hy===th.hy&&calH.hm===th.hm; } return calG.gy===t.getFullYear()&&calG.gm===t.getMonth(); }

function cellHTML(g, mainNum, subLabel, isT, hasEv, sacred){
  return `<div class="cell ${isT?'today':''} ${sacred||''}" data-date="${toISO(g)}"><div class="hd">${mainNum}</div><div class="gd">${subLabel}</div>${hasEv?'<span class="ev-dot"></span>':''}</div>`;
}
function calHijri(){
  const {hy,hm}=calH;
  const first=h2g(hy,hm,1);
  let len=29; for(let d=29;d<=30;d++){ const c=g2h(addDays(first,d-1)); if(c.hm===hm&&c.hd===d) len=d; }
  const startDow=noon(first).getDay();
  const events=genEvents(); const today=noon(new Date());
  let cells='';
  for(let i=0;i<startDow;i++){ const g=addDays(first,i-startDow); const c=g2h(g);
    cells+=`<div class="cell muted ${cellClasses(c)}" data-date="${toISO(g)}"><div class="hd">${c.hd}</div><div class="gd">${noon(g).getDate()}/${noon(g).getMonth()+1}</div></div>`; }
  for(let d=1;d<=len;d++){ const g=h2g(hy,hm,d);
    cells+=cellHTML(g, d, noon(g).getDate()+'/'+(noon(g).getMonth()+1), sameDay(g,today), events.some(e=>sameDay(e.date,g)), cellClasses({hm,hd:d})); }
  const haram=isHaram(hm);
  const haramNote=haram?`<div class="haram-note"><span class="hx">\u2726</span><div><b>Bulan Haram \u2014 ${MH[hm-1]}.</b> Salah satu bulan yang Allah muliakan. Keutamaan amal saleh dilipatgandakan dan dosa terasa lebih berat \u2014 perbanyak kebaikan, jagalah diri dari maksiat.</div></div>`:'';
  const lockNote=isLockedMonth(hy,hm)?`<div class="muted-note" style="margin-top:12px">\u2713 Bulan ini memakai tanggal penetapan yang kamu kunci.</div>`:'';
  return { title:`<div class="m">${MH[hm-1]}</div><div class="y">${hy} H</div>`, cells, haram,
    note: haramNote+lockNote };
}
function calGreg(){
  const {gy,gm}=calG;
  const first=noon(new Date(gy,gm,1));
  const len=new Date(gy,gm+1,0).getDate();
  const startDow=first.getDay();
  const events=genEvents(); const today=noon(new Date());
  const sub=(g)=>{ const h=g2h(g); return h.hd===1?MH[h.hm-1].slice(0,3):h.hd; };
  let cells='';
  for(let i=0;i<startDow;i++){ const g=addDays(first,i-startDow);
    cells+=`<div class="cell muted ${cellClasses(g2h(g))}" data-date="${toISO(g)}"><div class="hd">${noon(g).getDate()}</div><div class="gd">${sub(g)}</div></div>`; }
  for(let d=1;d<=len;d++){ const g=noon(new Date(gy,gm,d));
    cells+=cellHTML(g, d, sub(g), sameDay(g,today), events.some(e=>sameDay(e.date,g)), cellClasses(g2h(g))); }
  const h1=g2h(first).hm, h2=g2h(noon(new Date(gy,gm,len))).hm; const haramAny=isHaram(h1)||isHaram(h2);
  const haramNote=haramAny?`<div class="haram-note"><span class="hx">\u2726</span><div>Sebagian bulan ini termasuk <b>Bulan Haram</b> \u2014 perbanyak amal, jauhi dosa.</div></div>`:'';
  return { title:`<div class="m">${MG[gm]}</div><div class="y">${gy} M</div>`, cells,
    note: haramNote+`<div class="muted-note" style="margin-top:12px">Angka kecil = tanggal Hijriah; nama bulan muncul saat bulan Hijriah berganti.</div>` };
}
function showCalDay(date){

  else if(h.hm===8 && (h.hd===13||h.hd===14)){

    } else if(trk.length){ html+=`<div class="muted-note" style="margin-top:10px">Penanda amal aktif saat harinya tiba.</div>`; }

      const key=hy+'-'+lm.hm; const locked=S.locks[key];

      <button class="btn ghost" data-backup="paste">Tempel</button></div>

  // app
  h+=`<div class="section-title">Aplikasi</div><div class="card">
    <div class="set-row"><div class="l"><div class="t">Pasang ke layar utama</div><div class="d" id="installDesc">Jadikan HILAL seperti aplikasi biasa.</div></div>
      <button class="btn primary" id="installBtn" disabled>Pasang</button></div>
    <div class="set-row"><div class="l"><div class="t">Simpan data permanen</div><div class="d" id="persistDesc">Mencegah browser menghapus datamu saat penyimpanan penuh.</div></div>
      <button class="btn" id="persistBtn">Aktifkan</button></div>
    <div class="set-row"><div class="l"><div class="t">Tentang & sumber tanggal</div><div class="d">Cara kerja & catatan akurasi.</div></div>
      <button class="btn ghost" id="aboutBtn">Lihat</button></div>
  </div>`;

const CATS=[
 {k:'puasa',  t:'Puasa Sunnah',       c:'#cba64e', title:'Silent Pilgrim'},
 {k:'shalat', t:'Shalat Sunnah',      c:'#4a9d7a', title:'Veiled One'},

 {k:'majelis',t:'Majelis Ilmu',       c:'#8a9b5a', title:'Sagebound'},
];
const CATMAP=Object.fromEntries(CATS.map(c=>[c.k,c]));
const TRUTH={k:'truth', t:'Awal langkah', c:'#b9a6df', title:'Truth Seeker'};
const RANKS=[
 {k:'ash',t:'Ash',min:0,c:'#8a8f88'},{k:'stone',t:'Stone',min:40,c:'#9a9488'},
 {k:'bronze',t:'Bronze',min:100,c:'#b08d57'},{k:'silver',t:'Silver',min:200,c:'#c8ccd2'},

 {k:'emerald',t:'Emerald',min:760,c:'#2faa78'},{k:'obsidian',t:'Obsidian',min:1060,c:'#6b5fa0'},
 {k:'ivory',t:'Ivory',min:1450,c:'#ece7d8'},{k:'celestial',t:'Celestial',min:2000,c:'#e6cd92'},
];
function rankIndex(s){ let i=0; for(let j=0;j<RANKS.length;j++) if(s>=RANKS[j].min) i=j; return i; }
function rankOf(s){ return RANKS[rankIndex(s)]; }

/* ============================================================
   PROGRESI Fase 2b — hari-aktif per jalan + gerbang dependency
   Mata uang: jumlah HARI berbeda sebuah jalan dijalankan (anti-grind:
   satu hari = satu langkah, sebanyak apa pun amal hari itu). Permanen.
   ============================================================ */
const SILVER=3, GOLD=4, SAP=5;                       // indeks nama rank (RANKS)
const PATH_TH={                                       // ambang hari-aktif per jalan: ash,stone,bronze,silver,gold,sapphire,emerald
  _daily:[0,4,9,16,28,46,70],
  puasa: [0,2,5,8,14,23,35],                          // kadens Sen-Kam + Ayyamul Bidh
  majelis:[0,2,4,7,12,20,30]                          // kadens ~mingguan
};
const GDAYS=[0,12,30,70,130,220,340,500,720,1000];    // total hari-jalan -> rank global (RANKS[0..9])
const GATE={
  puasa:{tier:'root'}, dzikir:{tier:'root'}, tilawah:{tier:'root'},
  shalat: {tier:'bridge', self:GOLD, dep:[['dzikir'],['tilawah']]},
  infaq:  {tier:'bridge', self:GOLD, dep:[['puasa'],['dzikir']]},
  majelis:{tier:'bridge', self:GOLD, dep:[['tilawah'],['dzikir','infaq']]},
  qiyamul:{tier:'apex', self:SAP, needRoots:1, needBridges:2}
};
const RENUNGAN={
  puasa:"Menahan diri adalah gerbang pertama \u2014 dari ego yang dijinakkan, banyak jalan lain bermula.",
  dzikir:"Hati yang hidup mengingat-Nya adalah tanah; di atasnyalah ibadah-ibadah lain tumbuh berakar.",
  tilawah:"Mendekat pada firman-Nya membuka mata untuk memahami jalan-jalan yang datang setelahnya.",
  shalat:"Ruku\u2019 dan sujud menjadi perjumpaan, bukan sekadar gerak, ketika hati lebih dulu hidup berzikir atau lidah lebih dulu akrab dengan firman-Nya. Itulah mengapa khusyuk menanti kedalaman Dzikir atau Tilawah.",
  infaq:"Tangan yang memberi paling bersih saat ego sudah dilatih lapar oleh puasa, atau hati sudah terbiasa hanya mengharap pandangan-Nya lewat zikir \u2014 sebab memberi tanpa keduanya rawan menjadi panggung diri.",
  majelis:"Ilmu menjadi cahaya, bukan sekadar catatan, ketika berakar pada wahyu \u2014 atau ketika hati yang berzikir menuntunnya turun menjadi amal yang memberi. Maka ia menanti Tilawah, atau perpaduan Dzikir dan sedekah.",
  qiyamul:"Malam yang dihidupkan adalah muara, bukan hulu. Ia menyatu hanya pada jiwa yang telah meniti banyak jalan di siang hari \u2014 sebab yang sanggup berdiri lama di hadapan-Nya dalam gelap, adalah yang telah belajar mengisi terang dengan beragam bakti."
};
function catName(c){ return (CATMAP[c]||{}).t||c; }
function pathTh(c){ return PATH_TH[c]||PATH_TH._daily; }
function pathDays(c){ const s={}; const T=S.profile.track||{}; for(const k in T){ const r=T[k]; if(r&&r.s==='done'&&r.c===c) s[r.d]=1; } return Object.keys(s).length; }
function pathIdx(c){ const d=pathDays(c), th=pathTh(c); let i=0; for(let j=0;j<th.length;j++) if(d>=th[j]) i=j; return i; }
function totalDays(){ let s=0; for(const c of CATS) s+=pathDays(c.k); return s; }
function gIndex(){ const d=totalDays(); let i=0; for(let j=0;j<GDAYS.length;j++) if(d>=GDAYS[j]) i=j; return i; }
function activeDaySet(){ const s={}; const T=S.profile.track||{}; for(const k in T){ const r=T[k]; if(r&&r.s==='done') s[r.d]=1; } return s; }
function currentStreak(){ const s=activeDaySet(); const t=noon(new Date());
  let start=s[toISO(t)]?t:(s[toISO(addDays(t,-1))]?addDays(t,-1):null); if(!start) return 0;
  let n=0,d=start; while(s[toISO(d)]){ n++; d=addDays(d,-1); } return n; }
function depMet(dep){ return dep.some(cl=>cl.every(c=>pathIdx(c)>=GOLD)); }
function titleUnlocked(k){
  if(k==='truth') return true;
  if((S.profile.artifacts||[]).includes(k)) return true;          // sekali terbuka, permanen
  const g=GATE[k]; if(!g) return false;
  if(g.tier==='root') return pathIdx(k)>=GOLD || (pathIdx(k)>=SILVER && currentStreak()>=21);
  if(g.tier==='bridge') return pathIdx(k)>=g.self && depMet(g.dep);
  if(g.tier==='apex'){ const A=S.profile.artifacts||[];
    const r=['puasa','dzikir','tilawah'].filter(x=>A.includes(x)).length;
    const b=['shalat','infaq','majelis'].filter(x=>A.includes(x)).length;
    return pathIdx(k)>=g.self && r>=g.needRoots && b>=g.needBridges; }
  return false;
}
function evalUnlocks(){ if(!S.profile.started) return [];
  const A=S.profile.artifacts; const added=[];
  for(const k of ['puasa','dzikir','tilawah','shalat','infaq','majelis','qiyamul']){
    if(!A.includes(k) && titleUnlocked(k)){ A.push(k); added.push(k); } }
  return added;
}
function wornTitle(){ const A=S.profile.artifacts||[];
  const tiers=[['qiyamul'],['shalat','infaq','majelis'],['puasa','dzikir','tilawah']];
  for(const tier of tiers){ const own=tier.filter(k=>A.includes(k)); if(own.length){ own.sort((a,b)=>pathDays(b)-pathDays(a)); return own[0]; } }
  return 'truth'; }

/* ---------- emblems (simbol benda mati, sesuai sunnah) ---------- */
function emblemSym(key,col){
  switch(key){
    case 'puasa': return `<path d="M62 24a30 30 0 1 0 0 52 23 23 0 1 1 0-52z" fill="${col}"/>`;
    case 'shalat': return `<path d="M34 80V54a16 16 0 0 1 32 0v26" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"/><path d="M28 80h44" stroke="${col}" stroke-width="6" stroke-linecap="round"/>`;
    case 'qiyamul': return `<rect x="40" y="34" width="20" height="34" rx="4" fill="none" stroke="${col}" stroke-width="5"/><path d="M44 26h12v8H44z" fill="${col}"/><path d="M40 68h20l4 8H36z" fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="51" r="6" fill="${col}"/>`;
    case 'dzikir': { let s=''; for(let i=0;i<9;i++){const a=-Math.PI/2+i*(Math.PI*2/9);s+=`<circle cx="${(50+27*Math.cos(a)).toFixed(1)}" cy="${(52+27*Math.sin(a)).toFixed(1)}" r="5" fill="${col}"/>`;} return s; }
    case 'tilawah': return `<path d="M50 32c-7-5-17-6-24-3v40c7-3 17-2 24 3 7-5 17-6 24-3V29c-7-3-17-2-24 3z" fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round"/><path d="M50 32v40" stroke="${col}" stroke-width="4"/>`;
    case 'infaq': return `<path d="M50 24c10 16 18 23 18 33a18 18 0 1 1-36 0c0-10 8-17 18-33z" fill="${col}"/>`;
    case 'majelis': return `<path d="M32 34h30a6 6 0 0 1 6 6v36a7 7 0 0 0-6-4H32z" fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round"/><path d="M40 46h16M40 56h12" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`;
    default: { const pts=[]; for(let i=0;i<16;i++){const a=-Math.PI/2+i*Math.PI/8;const r=(i%2===0)?30:13;pts.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1));} return `<polygon points="${pts.join(' ')}" fill="${col}"/>`; }
  }
}

/* ---------- quest engine ---------- */
const OTHERS=['shalat','qiyamul','dzikir','tilawah','infaq','majelis'];
function questRatio(idx){ if(idx<=2)return 0; if(idx<=5)return .25; if(idx<=7)return .5; return .75; }
function daySeed(d,n){ let s=0; const str=d+'#'+n; for(let i=0;i<str.length;i++) s=(s*31+str.charCodeAt(i))>>>0; return s; }
function sr(s){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }
function questText(cat){ if(cat==='any')return{cat:'any',t:'Tunaikan satu amal apa pun hari ini'}; if(cat==='puasa')return{cat:'puasa',t:'Tunaikan puasa sunnah'}; return{cat,t:'Tunaikan ibadah '+(CATMAP[cat]?CATMAP[cat].t:cat)}; }
function genQuestBatch(idx,seed){ const p=questRatio(idx); const b=[];
  for(let i=0;i<2;i++){ const r=sr(seed+i*7); let cat;
    if(r<p) cat=OTHERS[Math.floor(sr(seed+i*7+99)*OTHERS.length)];
    else cat=(sr(seed+i*7+50)<.5)?'any':'puasa';
    b.push(Object.assign(questText(cat),{done:false})); }
  return b; }

/* ---------- tracker ---------- */
function occursOn(c,g){ g=noon(g);
  if(c.type==='once') return c.date===toISO(g);
  if(c.type==='weekly') return g.getDay()===c.weekday;
  if(c.type==='monthly'){ const last=new Date(g.getFullYear(),g.getMonth()+1,0).getDate(); return g.getDate()===Math.min(c.monthday,last); }
  return false; }
function trackablesOnDay(date){ const g=noon(date); const h=g2h(g); const day=g.getDay(); const ff=fastingForbidden(h); const out=[];
  const add=(id,cat,t)=>out.push({key:id+'@'+toISO(g),cat,t,day:toISO(g)});
  const addDual=(id,cat,also,t)=>out.push({key:id+'@'+toISO(g),cat,also,t,day:toISO(g)});
  if(!ff){ if(day===1)add('sys-senin','puasa','Puasa Senin'); if(day===4)add('sys-kamis','puasa','Puasa Kamis');
    if([13,14,15].includes(h.hd)&&!(h.hm===12&&h.hd===13))add('sys-ab','puasa','Puasa Ayyamul Bidh');
    if(h.hm===12&&h.hd===9)add('sys-arafah','puasa','Puasa Arafah');
    if(h.hm===1&&h.hd===9)add('sys-tasua','puasa','Puasa Tasua'); if(h.hm===1&&h.hd===10)add('sys-asyura','puasa','Puasa Asyura');
    if(h.hm===10 && h.hd>=2 && out.every(o=>o.cat!=='puasa')) add('sys-syawal','puasa','Puasa Syawal'); }
  if(day===5) add('sys-kahfi','tilawah','Baca Surah Al-Kahfi');
  if(day===4 && h.hd<=7) addDual('sys-tasbih','shalat','qiyamul','Shalat Tasbih');   // malam Jumat pertama bulan Hijriah
  if(sameDay(g,noon(new Date()))) add('sys-subuh','infaq','Sedekah Subuh');           // hanya hari ini, tanpa penanda kalender
  for(const c of S.custom){ if(occursOn(c,g)) out.push({key:'u-'+c.id+'@'+toISO(g),cat:c.category||'shalat',t:c.title,day:toISO(g)}); }
  return out; }
function syawalCount(){ const hy=g2h(new Date()).hy; const s={};
  for(const k in S.profile.track){ const r=S.profile.track[k]; if(r&&r.s==='done'&&r.c==='puasa'){ const hh=g2h(fromISO(r.d)); if(hh.hm===10&&hh.hy===hy) s[r.d]=1; } }
  return Object.keys(s).length; }
function trkState(key){ const r=S.profile.track[key]; return r?r.s:null; }
function setTrack(key,cat,dayISO,state,also){ const cur=trkState(key); const ak=also?(key+'|'+also):null;
  if(cur===state){ delete S.profile.track[key]; if(ak) delete S.profile.track[ak]; }
  else { S.profile.track[key]={s:state,c:cat,d:dayISO}; if(state==='done') questProgress(cat,dayISO);
    if(ak){ S.profile.track[ak]={s:state,c:also,d:dayISO}; if(state==='done') questProgress(also,dayISO); } }
  if(S.profile.started) titleSync();
  save(); }
function questProgress(cat,dayISO){ if(!S.profile.started) return; if(dayISO!==toISO(new Date())) return;
  profileSync(); const q=S.profile.q; let changed=false;
  let target=q.batch.find(qq=>!qq.done&&qq.cat===cat) || q.batch.find(qq=>!qq.done&&qq.cat==='any');
  if(target){ target.done=true; S.profile.score+=8; q.doneToday++; q.lastDone=toISO(new Date()); changed=true; }
  if(changed && q.batch.every(x=>x.done)){ const maxB=q.penaltyUntil?1:3;
    if(q.batchN<maxB){ q.batchN++; q.batch=genQuestBatch(rankIndex(S.profile.score),daySeed(toISO(new Date()),q.batchN)); }
    else q.exhausted=true; } }

/* ---------- daily + monthly sync ---------- */
function profileSync(){ if(!S.profile.started) return; const today=toISO(new Date()); const q=S.profile.q;
  if(q.day!==today){ const oldDay=q.day;
    if(oldDay!==null){ if(q.exhausted) q.maxedStreak=(q.maxedStreak||0)+1; else q.maxedStreak=0;
      if((q.maxedStreak||0)>=3 && !q.penaltyUntil) q.penaltyUntil=toISO(addDays(new Date(),7)); }
    if(q.penaltyUntil && today>=q.penaltyUntil){ q.penaltyUntil=null; q.maxedStreak=0; }
    let gap=oldDay?Math.round((fromISO(today)-fromISO(oldDay))/MS):0;
    let idle=Math.max(0,gap-((q.doneToday>0)?1:0));
    if(idle>0){ const dr=(rankIndex(S.profile.score)>=9?22:4); S.profile.score=Math.max(0,S.profile.score-dr*Math.min(idle,7)); }
    q.day=today; q.doneToday=0; q.exhausted=false; q.batchN=1; q.batch=genQuestBatch(rankIndex(S.profile.score),daySeed(today,1)); }
  titleSync(); save(); }
function tallyCategories(days){ const cut=addDays(new Date(),-days); const t={};
  for(const k in S.profile.track){ const r=S.profile.track[k]; if(r.s==='done'&&fromISO(r.d)>=cut) t[r.c]=(t[r.c]||0)+1; } return t; }
function titleSync(){ if(!S.profile.started) return;
  const added=evalUnlocks();
  S.profile.title={key:wornTitle()};
  if(added.length){ const cat=CATMAP[added[added.length-1]]||TRUTH;
    toast('Artefak terbuka: '+cat.title+(added.length>1?(' (+'+(added.length-1)+')'):'')); } }
function startJourney(){ S.profile.started=true; S.profile.startedAt=toISO(new Date());
  S.profile.title={key:'truth'}; S.profile.q.day=null;
  profileSync(); save(); renderProfil(); toast('Perjalananmu dimulai. Bismillah.'); }

/* ---------- pie ---------- */
function pieSVG(tally){ const entries=CATS.map(c=>({c,n:tally[c.k]||0})).filter(x=>x.n>0);
  const total=entries.reduce((s,x)=>s+x.n,0); const R=58,cx=64,cy=64;
  if(!total) return `<svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/></svg>`;
  if(entries.length===1) return `<svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="${R}" fill="${entries[0].c.c}"/><circle cx="64" cy="64" r="26" fill="var(--bg)"/></svg>`;
  let a=-Math.PI/2, paths='';
  for(const e of entries){ const frac=e.n/total; const a2=a+frac*Math.PI*2; const large=frac>0.5?1:0;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    paths+=`<path d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${e.c.c}"/>`; a=a2; }
  return `<svg width="128" height="128" viewBox="0 0 128 128">${paths}<circle cx="${cx}" cy="${cy}" r="26" fill="var(--bg)"/></svg>`; }

function seedDummy(){ const P=S.profile; const mix=['tilawah','tilawah','tilawah','dzikir','dzikir','puasa','shalat','infaq','majelis','qiyamul','tilawah','dzikir'];
  for(let i=0;i<mix.length;i++){ P.track['seed-'+i]={s:'done',c:mix[i],d:toISO(addDays(new Date(),-(i+1)))}; } }
function devAction(cmd){ const P=S.profile; const today=toISO(new Date()); const th=g2h(new Date());
  const i=cmd.indexOf(':'); const g=i<0?cmd:cmd.slice(0,i); const a=i<0?'':cmd.slice(i+1);
  if(g==='devoff'){ S._dev=false; save(); toast('Mode pengembang ditutup'); render(); return; }
  if(g==='start'){ P.started=true; P.startedAt=today; P.title={key:'truth',hy:th.hy,hm:th.hm}; P.q.day=null; profileSync(); save(); toast('Profiling diaktifkan'); render(); return; }
  if(g==='rank'){ P.score=(RANKS.find(x=>x.k===a)||RANKS[0]).min; }
  else if(g==='score'){ P.score=Math.max(0,P.score+(parseInt(a,10)||0)); }
  else if(g==='setscore'){ const el=document.getElementById('devScore'); P.score=Math.max(0,parseInt(el&&el.value,10)||0); }
  else if(g==='title'){ P.title={key:a,hy:th.hy,hm:th.hm}; if(a!=='truth'&&!P.artifacts.includes(a)) P.artifacts.push(a); }
  else if(g==='sync'){ if(a==='day'){ P.q.day=toISO(addDays(new Date(),-1)); P.q.doneToday=0; profileSync(); }
    else if(a==='title'){ P.title={key:P.title.key,hy:null,hm:null}; titleSync(); } }
  else if(g==='quest'){ const q=P.q;
    if(a==='fill'){ q.batch.forEach(x=>{ if(!x.done){ x.done=true; P.score+=8; q.doneToday++; q.lastDone=today; } });
      const maxB=q.penaltyUntil?1:3; if(q.batchN<maxB){ q.batchN++; q.batch=genQuestBatch(rankIndex(P.score),daySeed(today,q.batchN)); } else q.exhausted=true; }
    else if(a==='reset'){ q.batchN=1; q.exhausted=false; q.batch=genQuestBatch(rankIndex(P.score),daySeed(today,1)); } }
  else if(g==='penalty'){ if(a==='on'){ P.q.maxedStreak=3; P.q.penaltyUntil=toISO(addDays(new Date(),7)); P.q.batchN=1; P.q.exhausted=false; P.q.batch=genQuestBatch(rankIndex(P.score),daySeed(today,1)); } else { P.q.penaltyUntil=null; P.q.maxedStreak=0; } }
  else if(g==='unlockall'){ P.artifacts=['truth'].concat(CATS.map(c=>c.k)); }
  else if(g==='seed'){ seedDummy(); }
  else if(g==='grant'){ const c=a||'dzikir'; for(let i=0;i<50;i++){ P.track['grant-'+c+'-'+i]={s:'done',c,d:toISO(addDays(new Date(),-(i+1)))}; } titleSync(); }
  else if(g==='cleardays'){ for(const k in P.track){ if(k.indexOf('grant-')===0||k.indexOf('seed-')===0) delete P.track[k]; } titleSync(); }
  else if(g==='reset'){ if(a==='soft'){ P.track={}; P.score=0; P.title={key:'truth',hy:th.hy,hm:th.hm}; P.artifacts=['truth'];
      P.q={day:null,batch:[],batchN:1,doneToday:0,exhausted:false,maxedStreak:0,penaltyUntil:null,lastDone:null}; profileSync(); }
    else { P.started=false; } }
  save(); toast('Dev: '+cmd); render();
}

/* ============================================================
   CADANGAN & PEMULIHAN (Export / Import JSON)
   Satu berkas membawa: reminder + seluruh progres profil
   (rank crest, title, momentum quest, artefak terbuka).
   Impor "Gabungkan" tak pernah menghapus progres; impor
   "Ganti total" memuat ulang seluruh state dari berkas.
   ============================================================ */
const BK_SCHEMA=1;
let pendingImport=null;        // {data, summary, when, whenH}
let importMode='merge';

function pad2(n){ return String(n).padStart(2,'0'); }
function backupName(){ const h=g2h(new Date()); return `HILAL-cadangan-${h.hy}-${pad2(h.hm)}-${pad2(h.hd)}.json`; }

// Hitung ringkasan dari sebuah objek data (tanpa bergantung pada state global S),
// agar bisa dipakai untuk pratinjau berkas yang akan diimpor.
function distinctDaysByCat(track){ const m={}; for(const k in track){ const r=track[k]; if(r&&r.s==='done'&&r.c){ (m[r.c]=m[r.c]||{})[r.d]=1; } } return m; }
function summarizeData(d){
  const prof=(d&&d.profile)||{}; const track=prof.track||{};
  const byCat=distinctDaysByCat(track); const pdays={}; let total=0;
  for(const c of CATS){ const n=byCat[c.k]?Object.keys(byCat[c.k]).length:0; pdays[c.k]=n; total+=n; }
  let gi=0; for(let j=0;j<GDAYS.length;j++) if(total>=GDAYS[j]) gi=j;
  const arts=Array.isArray(prof.artifacts)?prof.artifacts:['truth'];
  const tiers=[['qiyamul'],['shalat','infaq','majelis'],['puasa','dzikir','tilawah']]; let worn='truth';
  for(const tier of tiers){ const own=tier.filter(k=>arts.includes(k)); if(own.length){ own.sort((a,b)=>(pdays[b]||0)-(pdays[a]||0)); worn=own[0]; break; } }
  const tc=worn==='truth'?TRUTH:(CATMAP[worn]||TRUTH);
  return { started:!!prof.started, score:prof.score||0,
    rank:RANKS[gi].t, totalDays:total, title:tc.title,
    artifactsAll:Array.isArray(arts)?arts.length:1,
    reminders:Array.isArray(d&&d.custom)?d.custom.length:0,
    locks:(d&&d.locks)?Object.keys(d.locks).length:0 };
}
function summaryRows(s,extra){
  const r=(k,v,g)=>`<div class="bk-row"><span class="k">${k}</span><span class="v${g?' gold':''}">${esc(String(v))}</span></div>`;
  let h='<div class="bk-summary">';
  h+=r('Perjalanan', s.started?'Sudah dimulai':'Belum dimulai');
  h+=r('Rank crest', s.rank, true);
  h+=r('Title', s.title, true);
  h+=r('Artefak terbuka', s.artifactsAll+' / 8');
  h+=r('Total hari ibadah', s.totalDays+' hari');
  h+=r('Skor quest', s.score);
  h+=r('Reminder tersimpan', s.reminders);
  if(s.locks) h+=r('Tanggal terkunci', s.locks);
  if(extra) h+=extra;
  h+='</div>';
  return h;
}

// Susun objek cadangan lengkap (envelope + data otoritatif).
function buildBackup(){
  const data={ settings:S.settings, locks:S.locks, custom:S.custom, dismissed:S.dismissed, profile:S.profile };
  const now=new Date(), h=g2h(now);
  return { app:'HILAL', kind:'hilal-backup', schema:BK_SCHEMA,
    exportedAt:now.toISOString(), exportedAtG:fmtGshort(now), exportedAtH:`${h.hd} ${MH[h.hm-1]} ${h.hy} H`,
    summary:summarizeData(data), data };
}
function backupString(){ return JSON.stringify(buildBackup(),null,2); }

function exportSheet(){
  const s=summarizeData({ settings:S.settings, locks:S.locks, custom:S.custom, profile:S.profile });
  openSheet(`<h3>Ekspor data HILAL</h3>
    <div class="muted-note" style="margin-bottom:8px">Seluruh isi di bawah dikemas dalam satu berkas JSON \u2014 bisa kamu simpan sebagai cadangan atau pindahkan ke perangkat lain. Tanpa server; berkasnya tetap milikmu.</div>
    ${summaryRows(s)}
    <div class="bk-actions">
      <button class="btn primary block" data-backup="download">Simpan berkas .json</button>
      ${('share' in navigator)?'<button class="btn block" data-backup="share">Bagikan\u2026</button>':''}
      <button class="btn ghost block" data-backup="copy">Salin sebagai teks</button>
    </div>`);
}
function downloadBackup(){
  try{
    const blob=new Blob([backupString()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=backupName();
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(url); },1500);
    toast('Berkas cadangan dibuat');
  }catch(e){ exportTextSheet(backupString()); }
}
async function shareBackup(){
  const str=backupString();
  try{
    if(navigator.canShare){ const file=new File([str],backupName(),{type:'application/json'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Cadangan HILAL',text:'Cadangan data HILAL'}); return; } }
    if(navigator.share){ await navigator.share({title:'Cadangan HILAL',text:str}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  downloadBackup();
}
async function copyBackup(){
  const str=backupString();
  try{ await navigator.clipboard.writeText(str); toast('Disalin ke papan klip'); }
  catch(e){ exportTextSheet(str); }
}
function exportTextSheet(str){
  openSheet(`<h3>Salin teks cadangan</h3>
    <div class="muted-note" style="margin-bottom:12px">Pilih semua teks di bawah lalu salin secara manual, simpan di tempat aman.</div>
    <div class="field"><textarea id="bk-out" class="mono" readonly style="min-height:170px">${esc(str)}</textarea></div>
    <button class="btn block" data-close>Tutup</button>`);
  const ta=sheet.querySelector('#bk-out'); if(ta){ ta.focus(); ta.select(); }
}

// ---- impor ----
function importPick(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json,text/plain';
  inp.style.display='none';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f){ return; }
    const rd=new FileReader();
    rd.onload=()=>handleImportText(String(rd.result||''));
    rd.onerror=()=>toast('Gagal membaca berkas');
    rd.readAsText(f); };
  document.body.appendChild(inp); inp.click();
  setTimeout(()=>{ try{ document.body.removeChild(inp); }catch(e){} },60000);
}
function importPasteSheet(){
  openSheet(`<h3>Tempel teks cadangan</h3>
    <div class="muted-note" style="margin-bottom:12px">Tempel seluruh isi berkas cadangan HILAL (format JSON) di kotak ini.</div>
    <div class="field"><textarea id="bk-paste" class="mono" placeholder='{ "app": "HILAL", "kind": "hilal-backup", \u2026 }' style="min-height:150px"></textarea></div>
    <button class="btn primary block" data-backup="paste-go">Lanjut</button>
    <button class="btn ghost block" data-close style="margin-top:9px">Batal</button>`);
}
function handleImportText(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ toast('Berkas bukan JSON yang sah'); return; }
  let data=null;
  if(obj && obj.kind==='hilal-backup' && obj.data && typeof obj.data==='object') data=obj.data;
  else if(obj && typeof obj==='object' && (obj.profile||obj.custom||obj.settings||obj.locks)) data=obj; // toleran: state mentah / versi lama
  if(!data){ toast('Ini bukan berkas cadangan HILAL'); return; }
  pendingImport={ data, summary:summarizeData(data),
    when:(obj&&obj.exportedAtG)||null, whenH:(obj&&obj.exportedAtH)||null };
  importMode='merge';
  importPreviewSheet();
}
function importPreviewSheet(){
  const p=pendingImport; if(!p) return; const s=p.summary;
  const when=p.when?`<div class="bk-row"><span class="k">Diekspor</span><span class="v">${esc(p.when)}${p.whenH?(' \u00b7 '+esc(p.whenH)):''}</span></div>`:'';
  openSheet(`<h3>Pulihkan data</h3>
    <div class="muted-note" style="margin-bottom:8px">Berkas ini berisi progres berikut. Pilih cara memulihkan, lalu tinjau sekali lagi sebelum melanjutkan.</div>
    ${summaryRows(s,when)}
    <div class="field" style="margin-bottom:8px"><label>Cara memulihkan</label>
      <div class="seg" id="bk-mode">
        <button data-bkmode="merge" class="on">Gabungkan</button>
        <button data-bkmode="replace">Ganti total</button>
      </div></div>
    <div class="muted-note" id="bk-modedesc">${bkModeDesc('merge')}</div>
    <button class="btn primary block" data-backup="apply" style="margin-top:14px">Pulihkan sekarang</button>
    <button class="btn ghost block" data-close style="margin-top:9px">Batal</button>`);
  const seg=sheet.querySelector('#bk-mode');
  if(seg) seg.querySelectorAll('button').forEach(b=> b.onclick=()=>{
    importMode=b.dataset.bkmode;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    const d=sheet.querySelector('#bk-modedesc'); if(d) d.textContent=bkModeDesc(importMode);
  });
}
function bkModeDesc(m){
  return m==='replace'
    ? 'Ganti total: data di perangkat ini dihapus dan diganti seluruhnya oleh isi berkas. Cocok untuk perangkat baru atau memulai dari cadangan tertentu.'
    : 'Gabungkan (disarankan): progres dari berkas ditambahkan ke progres di perangkat ini \u2014 tidak ada yang hilang. Artefak yang sudah terbuka tetap terbuka, hari ibadah digabung, dan skor mengambil nilai tertinggi.';
}
function applyImport(){
  const p=pendingImport; if(!p) return;
  if(importMode==='replace') replaceState(p.data); else mergeState(p.data);
  save();
  if(S.profile.started) profileSync(); else titleSync();
  pendingImport=null; closeSheet(); render();
  toast(importMode==='replace'?'Data diganti dari berkas':'Data berhasil digabungkan');
}

// ---- normalisasi & strategi tulis ----
function hydrateState(raw){
  let s; try{ s=Object.assign(JSON.parse(JSON.stringify(DEFAULT)), raw||{}); }catch(e){ s=JSON.parse(JSON.stringify(DEFAULT)); }
  s.profile=Object.assign(JSON.parse(JSON.stringify(DEFAULT.profile)), (raw&&raw.profile)||{});
  s.profile.q=Object.assign(JSON.parse(JSON.stringify(DEFAULT.profile.q)), (raw&&raw.profile&&raw.profile.q)||{});
  s.profile.track=(raw&&raw.profile&&raw.profile.track&&typeof raw.profile.track==='object')?raw.profile.track:{};
  if(!Array.isArray(s.profile.artifacts)) s.profile.artifacts=['truth'];
  if(!s.profile.artifacts.includes('truth')) s.profile.artifacts.unshift('truth');
  s.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT.settings)), (raw&&raw.settings)||{});
  s.locks=(raw&&raw.locks&&typeof raw.locks==='object')?raw.locks:{};
  s.custom=Array.isArray(raw&&raw.custom)?raw.custom.filter(c=>c&&typeof c==='object'):[];
  s.dismissed=(raw&&raw.dismissed&&typeof raw.dismissed==='object')?raw.dismissed:{};
  return s;
}
function replaceState(data){ const h=hydrateState(data);
  S.settings=h.settings; S.locks=h.locks; S.custom=h.custom; S.dismissed=h.dismissed; S.profile=h.profile; }
function mergeState(data){ const h=hydrateState(data); const P=S.profile, I=h.profile;
  // reminder: gabung berdasar id (yang sudah ada menang bila bentrok), id kosong diberi id baru
  const ids=new Set(S.custom.map(c=>c&&c.id));
  for(const c of h.custom){ if(!c) continue; if(c.id==null) c.id='c'+Date.now()+Math.floor(Math.random()*1000);
    if(!ids.has(c.id)){ S.custom.push(c); ids.add(c.id); } }
  // kunci tanggal: isi yang belum ada saja
  for(const k in h.locks){ if(!(k in S.locks)) S.locks[k]=h.locks[k]; }
  // banner ditutup: union
  for(const k in h.dismissed){ S.dismissed[k]=true; }
  // profil
  P.started=!!(P.started||I.started);
  P.startedAt=[P.startedAt,I.startedAt].filter(Boolean).sort()[0]||P.startedAt||I.startedAt||null;
  P.score=Math.max(P.score||0, I.score||0);
  const valid=new Set(['truth'].concat(CATS.map(c=>c.k)));
  const m=new Set(['truth']);
  (P.artifacts||[]).forEach(a=>{ if(valid.has(a)) m.add(a); });
  (I.artifacts||[]).forEach(a=>{ if(valid.has(a)) m.add(a); });
  P.artifacts=[...m];
  // jejak hari: union; 'done' mengalahkan status lain
  for(const k in I.track){ const inc=I.track[k]; if(!inc) continue; const cur=P.track[k];
    if(!cur) P.track[k]=inc; else if(cur.s!=='done'&&inc.s==='done') P.track[k]=inc; }
  // quest: ambil batch/progres dari hari yang lebih baru
  if((I.q.day||'') > (P.q.day||'')) P.q=JSON.parse(JSON.stringify(I.q));
}

/* ============================================================
   TOAST + ROUTING
   ============================================================ */
let toastT;
function toast(m,ms){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms||1900); }

let tab='home';
let lastRenderDay=null;   // tanggal lokal yang tercermin oleh tampilan saat ini
function go(t){ tab=t; document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#v-'+t).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){ if(tab==='home')renderHome(); else if(tab==='cal')renderCal(); else if(tab==='notes')renderNotes(); else if(tab==='profil')renderProfil(); else renderSet(); lastRenderDay=toISO(new Date()); }

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#fab').onclick=()=>customForm(null);

/* ---------- delegated clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-mode],[data-evt],[data-season],[data-calmode],[data-caltoday],[data-cal],[data-date],[data-off],[data-lockset],[data-lockclear],[data-dismiss],[data-edit],[data-questbegin],[data-goto],[data-track],[data-titledetail],[data-backup],[data-dev],#installBtn,#persistBtn,#aboutBtn');
  if(!t) return;
  if(t.dataset.mode){ S.settings.feedMode=t.dataset.mode; save(); renderFeedArea(); return; }
  if(t.dataset.evt && !e.target.closest('[data-edit]')){ const r=t.closest('.evt'); if(r) r.classList.toggle('open'); return; }
  if(t.dataset.edit){ const c=S.custom.find(x=>x.id===t.dataset.edit); if(c) customForm(c); return; }
  if(t.dataset.season!=null){ const s=seasons()[+t.dataset.season]; if(s){ openSheet(`<h3>${esc(s.t)}</h3><div class="muted-note" style="line-height:1.6">${esc(s.ins)}</div><button class="btn block" data-close style="margin-top:16px">Tutup</button>`);} return; }
  if(t.dataset.calmode){ if(calMode!==t.dataset.calmode){ calMode=t.dataset.calmode; renderCal(); } return; }
  if(t.dataset.caltoday){ initCalRefs(); renderCal(); return; }
  if(t.dataset.cal){ const dir=+t.dataset.cal;
    if(calMode==='hijri'){ calH.hm+=dir; if(calH.hm>12){calH.hm=1;calH.hy++;} if(calH.hm<1){calH.hm=12;calH.hy--;} }
    else { calG.gm+=dir; if(calG.gm>11){calG.gm=0;calG.gy++;} if(calG.gm<0){calG.gm=11;calG.gy--;} }
    renderCal(); return; }
  if(t.dataset.date){ document.querySelectorAll('.cell').forEach(c=>c.classList.remove('sel')); t.classList.add('sel'); showCalDay(fromISO(t.dataset.date)); return; }
  if(t.dataset.off){ S.settings.dayOffset=Math.max(-3,Math.min(3,(S.settings.dayOffset||0)+ +t.dataset.off)); save(); renderSet(); return; }
  if(t.dataset.lockset){ lockForm(t.dataset.lockset); return; }
  if(t.dataset.lockclear){ delete S.locks[t.dataset.lockclear]; save(); toast('Kunci dihapus'); render(); return; }
  if(t.dataset.dismiss){ S.dismissed['c'+t.dataset.dismiss]=true; save(); renderHome(); return; }
  if(t.id==='installBtn'){ doInstall(); return; }
  if(t.id==='persistBtn'){ doPersist(); return; }
  if(t.id==='aboutBtn'){ aboutSheet(); return; }
  if(t.dataset.questbegin){ startJourney(); return; }
  if(t.dataset.goto){ go(t.dataset.goto); return; }
  if(t.dataset.titledetail){ openTitleSheet(t.dataset.titledetail); return; }
  if(t.dataset.backup){ const b=t.dataset.backup;
    if(b==='export') exportSheet();
    else if(b==='download') downloadBackup();
    else if(b==='share') shareBackup();
    else if(b==='copy') copyBackup();
    else if(b==='import') importPick();
    else if(b==='paste') importPasteSheet();
    else if(b==='paste-go'){ const ta=$('#bk-paste'); const v=ta?ta.value:''; if(!v.trim()){ toast('Belum ada teks'); return; } handleImportText(v); }
    else if(b==='apply') applyImport();
    return; }
  if(t.dataset.track){ setTrack(t.dataset.track,t.dataset.trackcat,t.dataset.trackday,t.dataset.trackstate,t.dataset.trackalso||null);
    if(tab==='cal') showCalDay(fromISO(t.dataset.trackday)); else render(); return; }
  if(t.dataset.dev){ devAction(t.dataset.dev); return; }
});

/* ---------- install (PWA) ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; refreshInstallUI(); });
function refreshInstallUI(){ const b=$('#installBtn'), d=$('#installDesc'); if(!b)return;
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  if(standalone){ b.textContent='Terpasang'; b.disabled=true; if(d)d.textContent='HILAL sudah berjalan sebagai aplikasi.'; }
  else if(deferredPrompt){ b.disabled=false; b.textContent='Pasang'; }
  else { b.disabled=true; if(d)d.innerHTML='Buka menu browser \u2192 \u201cTambahkan ke Layar Utama\u201d.'; }
}
async function doInstall(){ if(!deferredPrompt)return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; refreshInstallUI(); }

/* ---------- persistent storage ---------- */
async function refreshPersistUI(){ const b=$('#persistBtn'), d=$('#persistDesc'); if(!b||!navigator.storage||!navigator.storage.persisted)return;
  const p=await navigator.storage.persisted(); if(p){ b.textContent='Aktif'; b.disabled=true; if(d)d.textContent='Data terlindungi dari penghapusan otomatis.'; } }
async function doPersist(){ if(!navigator.storage||!navigator.storage.persist){ toast('Tidak didukung browser ini'); return; }
  const ok=await navigator.storage.persist(); toast(ok?'Penyimpanan permanen aktif':'Permintaan ditolak browser'); refreshPersistUI(); }

/* ---------- service worker ---------- */
let swReg=null;
if('serviceWorker' in navigator){
  const wasControlled=!!navigator.serviceWorker.controller;   // sudah pernah dikontrol = pengunjung lama
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').then(reg=>{ swReg=reg; }).catch(()=>{}); });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(wasControlled) toast('Versi terbaru HILAL aktif'); });
}

/* ============================================================
   REFRESH SAAT RESUME + OPTIMASI ONLINE-FIRST
   - Resume/ganti hari: hitung ulang "hari ini" & render ulang
     (memperbaiki penanda hari yang basi, mis. Sedekah Subuh).
   - Online sebagai keuntungan, TANPA mengorbankan offline:
     (1) jaga aplikasi tetap versi terbaru selagi terhubung,
     (2) penjaga ketepatan jam perangkat demi integritas tanggal
         Hijriah \u2014 verifikasi gratis lewat header waktu hosting
         kita sendiri. Semua dibungkus try/catch + cek onLine,
         sehingga saat offline jalurnya identik seperti sebelumnya.
   ============================================================ */
let clockCheckedThisSession=false;

function refreshIfStale(){
  if(document.hidden) return;
  if(modal.classList.contains('show')) return;            // jangan ganggu lembar yang sedang terbuka
  const today=toISO(new Date());
  if(today!==lastRenderDay){                              // hari benar-benar berganti sejak render terakhir
    if(S.profile.started) profileSync();                  // gulung quest harian ke hari baru
    render();                                             // recompute hari ini, hitung mundur, penanda amal
  }
}
function onResume(){ refreshIfStale(); onlineBoost(); }

function onlineBoost(){
  if(!navigator.onLine) return;                           // offline: tak melakukan apa pun (jalur lama utuh)
  if(swReg && swReg.update){ try{ swReg.update(); }catch(e){} }   // tarik versi terbaru bila ada
  if(!clockCheckedThisSession){ clockCheckedThisSession=true; checkClockDrift(); }
}
async function checkClockDrift(){
  if(!navigator.onLine) return;
  try{
    const res=await fetch('./?_clk='+Date.now(),{method:'HEAD',cache:'no-store'});
    const ds=res.headers.get('date'); if(!ds) return;     // membandingkan dua instan UTC: zona waktu tak relevan
    const server=new Date(ds).getTime(); if(!server) return;
    const drift=Math.abs(Date.now()-server);
    if(drift>5*60*1000){                                  // ambang longgar 5 menit -> hanya jam yang benar-benar meleset
      toast('Jam perangkat tampak meleset \u00b1'+Math.round(drift/60000)+' menit dari waktu jaringan \u2014 bila tanggal terasa keliru, sesuaikan di Atur \u2192 Geser hari.',6500);
    }
  }catch(e){ /* offline / HEAD diblokir / file:// -> diabaikan */ }
}

document.addEventListener('visibilitychange',()=>{ if(!document.hidden) onResume(); });
window.addEventListener('pageshow',()=>onResume());
window.addEventListener('focus',()=>onResume());
window.addEventListener('online',()=>onResume());

/* ---------- boot ---------- */
(function(){ const el=$('#todayMini'); if(!el) return; let n=0,t0=0;
  el.addEventListener('click',()=>{ const now=Date.now(); if(now-t0>1500)n=0; t0=now; n++;
    if(n>=7){ n=0; S._dev=!S._dev; save(); toast(S._dev?'Mode pengembang aktif':'Mode pengembang nonaktif'); if(tab==='set')renderSet(); } }); })();
if(S.profile.started) profileSync();
render();
onResume();   // online user dapat cek versi + ketepatan jam sejak load pertama
</script>
